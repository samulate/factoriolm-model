[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factoriolm-model"
version = "0.2.0"
description = "Training, quantization, and exact integer reference inference for FactorioLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FactorioLM contributors"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6"]

[project.scripts]
factoriolm-model = "factorio_lm.cli:main"

[tool.setuptools.packages.find]
include = ["factorio_lm*"]
